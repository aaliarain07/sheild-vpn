<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#121A2B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Glowing Radial Accent -->
  <circle cx="256" cy="256" r="160" fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Shield Shape Outer Glow -->
  <path
    d="M 256 80 L 396 140 C 396 280, 256 390, 256 432 C 256 390, 116 280, 116 140 Z"
    fill="url(#shieldGrad)"
    filter="url(#glow)"
    opacity="0.3"
  />

  <!-- Main Shield Body -->
  <path
    d="M 256 96 L 380 150 C 380 274, 256 372, 256 412 C 256 372, 132 274, 132 150 Z"
    fill="url(#shieldGrad)"
  />

  <!-- Inner High-Contrast Shield Layer -->
  <path
    d="M 256 128 L 352 170 C 352 264, 256 342, 256 376 C 256 342, 160 264, 160 170 Z"
    fill="#0B1220"
  />

  <!-- Center Keyhole / Checkmark Emblem -->
  <path
    d="M 220 250 L 246 276 L 302 216"
    fill="none"
    stroke="url(#shieldGrad)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small Glowing Node at Top Center -->
  <circle cx="256" cy="180" r="12" fill="#06B6D4" />
</svg>
